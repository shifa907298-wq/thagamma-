<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zap Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#d9b463;color:#111827;display:grid;place-items:center;padding:12px}.shell{width:min(100%,860px);height:min(92vh,820px);min-height:560px;border:1px solid rgba(255,255,255,.9);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;background:#d9b463;box-shadow:0 18px 50px rgba(15,29,53,.12)}header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.75)}.logo{width:34px;height:34px;border-radius:10px;background:#0f1d35;color:white;display:grid;place-items:center;font-weight:800}.title{font-size:14px;font-weight:800}.status{font-size:10px;color:#667085;margin-top:2px}.body{overflow-y:auto;padding:14px}.row{display:flex;margin-bottom:10px}.row.user{justify-content:flex-end}.bubble{max-width:min(80%,620px);padding:10px 12px;border-radius:13px;background:#f8fafc;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.row.user .bubble{background:#0f1d35;color:white}.row.error .bubble{background:#fef3f2;color:#b42318}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 12px}.chip{border:1px solid #e5e7eb;background:white;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:7px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}.media{aspect-ratio:1/1;padding:12px;background:white;display:flex;align-items:center;justify-content:center}.media img{width:100%;height:100%;object-fit:contain;object-position:center}.copy{padding:10px}.name{font-size:13px;font-weight:800;cursor:pointer}.price{font-size:13px;font-weight:800;margin-top:6px}.meta,.desc{font-size:11px;color:#475467;line-height:1.4;margin-top:5px}.stock{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:700}.in{background:#dcfce7;color:#166534}.out{background:#fee2e2;color:#991b1b}.compare{margin:8px 0 14px}.table-wrap{overflow-x:auto;background:white;border:1px solid #e5e7eb;border-radius:14px;margin:7px 0 14px}table{width:100%;min-width:650px;border-collapse:collapse;font-size:11px}th,td{padding:9px;text-align:left;vertical-align:top;border-bottom:1px solid #e5e7eb}th{background:#f8fafc}.typing{display:inline-flex;gap:5px}.typing span{width:6px;height:6px;border-radius:50%;background:#98a2b3;animation:b 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-4px)}}footer{border-top:1px solid rgba(255,255,255,.75);padding:8px}.composer{display:grid;grid-template-columns:1fr auto;gap:7px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.9);border-radius:13px;padding:6px}textarea{border:0;outline:0;background:transparent;resize:none;min-height:38px;max-height:120px;padding:8px;font:inherit}.send{width:40px;height:40px;border:0;border-radius:10px;background:#0f1d35;color:white;cursor:pointer}.send:disabled{opacity:.45}@media(max-width:700px){body{padding:0}.shell{width:100%;height:100dvh;min-height:100dvh;border:0;border-radius:0}.products{grid-template-columns:1fr}.media{aspect-ratio:4/3}.bubble{max-width:90%}}
</style>
</head>
<body>
<main class="shell">
<header><div class="logo">Z</div><div><div class="title">ZAP CHAT</div><div class="status">● AI product assistant</div></div></header>
<section id="chat" class="body">
<div class="row bot"><div class="bubble">Hi! I can help you discover products, compare options, check prices and availability, or browse by category.</div></div>
<div id="quick" class="actions">
<button class="chip" data-message="What products are available?">Browse categories</button>
<button class="chip" data-message="Show me smartphones under 100 OMR">Phones under 100 OMR</button>
<button class="chip" data-message="Recommend a good power bank">Recommend a power bank</button>
</div>
</section>
<footer><div class="composer"><textarea id="input" maxlength="1200" placeholder="Ask Zap Chat..."></textarea><button id="send" class="send">➤</button></div></footer>
</main>
<script>
const CHAT_API_URL="https://zapsoole.app.n8n.cloud/webhook/zap-chat-search-v7";

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const quick=document.getElementById("quick");

const txt=v=>typeof v==="string"?v.trim():"";

function makeId(prefix){
  return prefix+(crypto.randomUUID?crypto.randomUUID():(Date.now()+"_"+Math.random().toString(36).slice(2)));
}

let sessionId=localStorage.getItem("zapChatV7SessionId")||makeId("session_");
let browserUserId=localStorage.getItem("zapChatV7BrowserUserId")||makeId("browser_");
localStorage.setItem("zapChatV7SessionId",sessionId);
localStorage.setItem("zapChatV7BrowserUserId",browserUserId);

let activeCategory="";
let lastProducts=[];

function bottom(){chat.scrollTop=chat.scrollHeight}

function addMessage(message,sender="bot",extra=""){
  const row=document.createElement("div");
  row.className=`row ${sender} ${extra}`.trim();
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=message;
  row.appendChild(bubble);
  chat.appendChild(row);
  bottom();
}

function addTyping(){
  removeTyping();
  const row=document.createElement("div");
  row.id="typing";
  row.className="row bot";
  row.innerHTML='<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(row);
  bottom();
}
function removeTyping(){document.getElementById("typing")?.remove()}

function priceOf(p){
  if(txt(p?.price?.formatted)) return txt(p.price.formatted);
  const n=Number(p?.price?.amount??p?.price);
  return Number.isFinite(n)?`OMR ${n.toFixed(3)}`:"Price not confirmed";
}

function stockOf(p){
  const status=p?.stock?.status??p?.availability;
  const label=txt(p?.stock?.label)||(status==="in_stock"?"In Stock":status==="out_of_stock"?"Out of Stock":"Stock not confirmed");
  return {status,label};
}

function imageUrl(p){
  const raw=txt(p?.image?.url)||txt(p?.image_url);
  if(!raw) return "";
  try{
    const u=new URL(raw.startsWith("//")?"https:"+raw:raw);
    return u.protocol==="https:"?u.href:"";
  }catch{return ""}
}

function remember(products){
  lastProducts=products.slice(0,3).map(p=>({
    id:String(p?.id??""),
    name:txt(p?.title)||txt(p?.name),
    category:txt(p?.category)
  })).filter(p=>p.id||p.name);
}

function addProducts(products,keep=true){
  if(!Array.isArray(products)||!products.length) return;
  if(keep) remember(products);

  const grid=document.createElement("div");
  grid.className="products";

  products.slice(0,3).forEach(p=>{
    const card=document.createElement("article");
    card.className="card";

    const media=document.createElement("div");
    media.className="media";

    const url=imageUrl(p);
    if(url){
      const img=document.createElement("img");
      img.src=url;
      img.alt=txt(p?.title)||txt(p?.name)||"Product";
      img.addEventListener("error",()=>media.textContent="Image unavailable");
      media.appendChild(img);
    }else{
      media.textContent="No image available";
    }

    const copy=document.createElement("div");
    copy.className="copy";

    const name=document.createElement("div");
    name.className="name";
    name.textContent=txt(p?.title)||txt(p?.name)||"Product";
    name.onclick=()=>sendMessage(name.textContent,{action:"get_product_details",productId:String(p?.id??"")});

    const price=document.createElement("div");
    price.className="price";
    price.textContent=priceOf(p);

    const stockInfo=stockOf(p);
    const stock=document.createElement("span");
    stock.className="stock "+(stockInfo.status==="in_stock"?"in":"out");
    stock.textContent=stockInfo.label;

    const meta=document.createElement("div");
    meta.className="meta";
    meta.textContent=txt(p?.category);

    const desc=document.createElement("div");
    desc.className="desc";
    desc.textContent=txt(p?.description);

    copy.append(name,price,stock);
    if(meta.textContent) copy.appendChild(meta);
    if(desc.textContent) copy.appendChild(desc);
    card.append(media,copy);
    grid.appendChild(card);
  });

  chat.appendChild(grid);

  if(keep && lastProducts.length>=2){
    const wrap=document.createElement("div");
    wrap.className="compare";
    const b=document.createElement("button");
    b.className="chip";
    b.textContent="Compare these products";
    b.onclick=()=>sendMessage("Compare these products",{
      action:"compare_products",
      compareProductIds:lastProducts.map(p=>p.id).filter(Boolean)
    });
    wrap.appendChild(b);
    chat.appendChild(wrap);
  }
  bottom();
}

function addCategories(categories){
  if(!Array.isArray(categories)||!categories.length) return;
  const wrap=document.createElement("div");
  wrap.className="actions";

  [...new Set(categories.map(txt).filter(Boolean))].forEach(category=>{
    const b=document.createElement("button");
    b.className="chip";
    b.textContent=category;
    b.onclick=()=>{
      activeCategory=category;
      sendMessage(`Show me ${category}`,{action:"browse_category",category});
    };
    wrap.appendChild(b);
  });

  chat.appendChild(wrap);
  bottom();
}

function addComparison(comparison){
  if(!comparison||!Array.isArray(comparison.rows)||!comparison.rows.length) return;

  const wrap=document.createElement("div");
  wrap.className="table-wrap";
  const table=document.createElement("table");
  table.innerHTML="<thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th></tr></thead>";
  const tbody=document.createElement("tbody");

  comparison.rows.forEach(r=>{
    const tr=document.createElement("tr");
    [r?.title||"Product",r?.category||"—",r?.price||"—",r?.stock||"—",r?.description||"—"].forEach(v=>{
      const td=document.createElement("td");
      td.textContent=String(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  chat.appendChild(wrap);
  bottom();
}

function render(data){
  if(txt(data?.output)) addMessage(data.output,"bot");
  addCategories(data?.categories);
  addProducts(data?.products,data?.responseType!=="product_detail"&&data?.responseType!=="comparison");
  addComparison(data?.comparison);
}

async function sendMessage(prefilled=null,meta={}){
  const message=txt(prefilled??input.value);
  if(!message||send.disabled) return;

  if(quick) quick.style.display="none";
  addMessage(message,"user");
  input.value="";
  send.disabled=true;
  addTyping();

  try{
    const response=await fetch(CHAT_API_URL,{
      method:"POST",
      mode:"cors",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({
        message,
        sessionId,
        browserUserId,
        activeCategory,
        contextProducts:lastProducts,
        ...meta
      })
    });

    const raw=await response.text();

    if(!raw.trim()){
      throw new Error(`Empty n8n response (HTTP ${response.status})`);
    }

    let data;
    try{data=JSON.parse(raw)}
    catch{throw new Error(`Invalid n8n JSON (HTTP ${response.status})`)}

    if(!response.ok){
      throw new Error(txt(data?.output)||`n8n HTTP ${response.status}`);
    }

    removeTyping();
    render(data);

  }catch(err){
    removeTyping();
    console.error(err);
    addMessage(`Zap Chat error: ${err.message}`,"bot","error");
  }finally{
    send.disabled=false;
    input.focus();
  }
}

send.onclick=()=>sendMessage();
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
document.querySelectorAll("#quick .chip").forEach(b=>b.onclick=()=>sendMessage(b.dataset.message));
</script>
</body>
</html>
