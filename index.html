<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Zapsule AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #D4B068;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --brand: #111827;
      --brand-2: #1f2937;
      --user: #111827;
      --bot: #f3f4f6;
      --danger: #b91c1c;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .chat-shell {
      width: min(100%, 860px);
      height: min(88vh, 780px);
      min-height: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(17, 24, 39, 0.12);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      background: #D4B068;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--brand);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
    }

    .header-copy h1 {
      font-size: 18px;
    }

    .status {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .chat-body {
      overflow-y: auto;
      padding: 24px 20px 16px;
      background: #D4B068;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      margin-bottom: 14px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(78%, 620px);
      padding: 12px 14px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.bot .bubble {
      background: var(--bot);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .message-row.user .bubble {
      background: var(--user);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 20px;
    }

    .quick-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-width: 54px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .55;
      }
      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: #D4B068;
    }

    .composer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
    }

    textarea {
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 8px 10px;
      min-height: 42px;
      max-height: 120px;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      background: transparent;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
    }

    .helper {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
    }
.product-image {
  display: block;
  width: 100%;
  max-width: 280px;
  height: auto;
  margin-top: 10px;
  border-radius: 12px;
  object-fit: cover;
}
    .error .bubble {
      color: var(--danger) !important;
      background: #fef2f2 !important;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
        background: #fff;
      }

      .chat-shell {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .chat-header {
        padding: 14px 16px;
      }

      .chat-body {
        padding: 20px 14px 12px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>
  <main class="chat-shell">
    <header class="chat-header">
      <div class="logo">Z</div>

      <div class="header-copy">
        <h1>Zapsule</h1>
        <div class="status">
          <span class="status-dot"></span>
          AI product assistant
        </div>
      </div>
    </header>

    <section id="chatBody" class="chat-body" aria-live="polite">
      <div class="message-row bot">
        <div class="bubble">
          Hi! I'm Zapsule. Ask me about products, prices, availability, specifications, or recommendations.
        </div>
      </div>

      <div class="quick-actions" id="quickActions">
        <button class="quick-btn" data-message="What products are available?">
          Available products
        </button>

        <button class="quick-btn" data-message="Show me smartphones under 100 OMR">
          Phones under 100 OMR
        </button>

        <button class="quick-btn" data-message="Can you recommend a good power bank?">
          Recommend a power bank
        </button>
      </div>
    </section>

    <footer class="composer">
      <div class="composer-row">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Ask Zapsule..."
          aria-label="Message"
        ></textarea>

        <button id="sendButton" class="send-btn" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M22 2 11 13"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="m22 2-7 20-4-9-9-4 20-7Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <div class="helper">Powered by Zapsule AI</div>
    </footer>
  </main>

  <script>
    // n8n PRODUCTION webhook
    const WEBHOOK_URL =
      "https://zapsule.app.n8n.cloud/webhook/ecommerce-chat";

    const chatBody = document.getElementById("chatBody");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const quickActions = document.getElementById("quickActions");

    let sessionId = localStorage.getItem("zapsuleSessionId");

    if (!sessionId) {
      sessionId =
        window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : "session-" +
            Date.now() +
            "-" +
            Math.random().toString(36).slice(2);

      localStorage.setItem("zapsuleSessionId", sessionId);
    }

  function addMessage(text, sender = "bot", extraClass = "") {
  const row = document.createElement("div");
  row.className = `message-row ${sender} ${extraClass}`.trim();

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const imageMatch =
    sender === "bot"
      ? text.match(/IMAGE_URL:\s*(https?:\/\/[^\s]+)/i)
      : null;

  const cleanText = imageMatch
    ? text.replace(/IMAGE_URL:\s*https?:\/\/[^\s]+/i, "").trim()
    : text;

  bubble.textContent = cleanText;

  if (imageMatch) {
    const img = document.createElement("img");

    img.src = imageMatch[1];
    img.alt = "Product image";
    img.className = "product-image";
    img.loading = "lazy";

    img.onerror = () => {
      img.remove();
    };

    bubble.appendChild(img);
  }

  row.appendChild(bubble);
  chatBody.appendChild(row);

  scrollToBottom();

  return row;
}

    function addTypingIndicator() {
      const row = document.createElement("div");
      row.className = "message-row bot";
      row.id = "typingRow";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      bubble.appendChild(typing);
      row.appendChild(bubble);
      chatBody.appendChild(row);

      scrollToBottom();
    }

    function removeTypingIndicator() {
      document.getElementById("typingRow")?.remove();
    }

    function scrollToBottom() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function resizeTextarea() {
      messageInput.style.height = "auto";
      messageInput.style.height =
        Math.min(messageInput.scrollHeight, 120) + "px";
    }

    function extractReply(data) {
      if (typeof data?.output === "string") return data.output;
      if (typeof data?.reply === "string") return data.reply;
      if (typeof data?.message === "string") return data.message;
      if (typeof data?.text === "string") return data.text;

      if (Array.isArray(data) && data.length > 0) {
        const first = data[0];

        if (typeof first?.output === "string") return first.output;
        if (typeof first?.reply === "string") return first.reply;
        if (typeof first?.message === "string") return first.message;
      }

      return "I received a response, but I couldn't read its message format.";
    }

    async function sendMessage(prefilledMessage = null) {
      const message =
        (prefilledMessage ?? messageInput.value).trim();

      if (!message || sendButton.disabled) return;

      if (quickActions) {
        quickActions.style.display = "none";
      }

      addMessage(message, "user");

      messageInput.value = "";
      resizeTextarea();

      sendButton.disabled = true;
      messageInput.disabled = true;

      addTypingIndicator();

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message,
            sessionId: sessionId,
            source: "zapsule-web"
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        removeTypingIndicator();

        const reply = extractReply(data);

        addMessage(reply, "bot");

      } catch (error) {
        console.error("Zapsule webhook error:", error);

        removeTypingIndicator();

        addMessage(
          "I couldn't connect to Zapsule AI. Please try again.",
          "bot",
          "error"
        );

      } finally {
        sendButton.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", () => {
      sendMessage();
    });

    messageInput.addEventListener("input", resizeTextarea);

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.querySelectorAll(".quick-btn").forEach((button) => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.message);
      });
    });
  </script>
</body>
</html>
