<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Zapsule AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #d4b068;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --brand: #111827;
      --user: #111827;
      --bot: #f3f4f6;
      --danger: #b91c1c;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .chat-shell {
      width: min(100%, 860px);
      height: min(88vh, 780px);
      min-height: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(17, 24, 39, 0.12);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
      flex: 0 0 auto;
    }

    .header-copy h1 {
      font-size: 18px;
    }

    .status {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .chat-body {
      overflow-y: auto;
      padding: 24px 20px 16px;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      margin-bottom: 14px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(78%, 620px);
      padding: 12px 14px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.bot .bubble {
      background: var(--bot);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    .message-row.user .bubble {
      background: var(--user);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .message-text + .product-image,
    .message-text + .image-wrap {
      margin-top: 10px;
    }

    .image-wrap {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .product-image {
      display: block;
      width: 100%;
      max-width: 280px;
      height: auto;
      max-height: 340px;
      border-radius: 12px;
      object-fit: contain;
      background: #fff;
      border: 1px solid rgba(17, 24, 39, 0.08);
    }

    .image-error {
      display: none;
      margin-top: 8px;
      color: var(--danger);
      font-size: 12px;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0 20px;
    }

    .quick-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      min-width: 54px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.55; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: var(--bg);
    }

    .composer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
    }

    textarea {
      width: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 8px 10px;
      min-height: 42px;
      max-height: 120px;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      background: transparent;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
    }

    .helper {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
    }

    .error .bubble {
      color: var(--danger) !important;
      background: #fef2f2 !important;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
        background: #fff;
      }

      .chat-shell {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .chat-header {
        padding: 14px 16px;
      }

      .chat-body {
        padding: 20px 14px 12px;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>
  <main class="chat-shell">
    <header class="chat-header">
      <div class="logo">Z</div>
      <div class="header-copy">
        <h1>Zapsule</h1>
        <div class="status">
          <span class="status-dot"></span>
          AI product assistant
        </div>
      </div>
    </header>

    <section id="chatBody" class="chat-body" aria-live="polite">
      <div class="message-row bot">
        <div class="bubble">
          Hi! I'm Zapsule. Ask me about products, prices, availability, specifications, or recommendations.
        </div>
      </div>

      <div class="quick-actions" id="quickActions">
        <button class="quick-btn" data-message="What products are available?">
          Available products
        </button>
        <button class="quick-btn" data-message="Show me smartphones under 100 OMR">
          Phones under 100 OMR
        </button>
        <button class="quick-btn" data-message="Can you recommend a good power bank?">
          Recommend a power bank
        </button>
      </div>
    </section>

    <footer class="composer">
      <div class="composer-row">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Ask Zapsule..."
          aria-label="Message"
        ></textarea>

        <button id="sendButton" class="send-btn" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M22 2 11 13"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="m22 2-7 20-4-9-9-4 20-7Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <div class="helper">Powered by Zapsule AI</div>
    </footer>
  </main>

  <script>
    // n8n production webhook
    const WEBHOOK_URL = "https://zapsule.app.n8n.cloud/webhook/ecommerce-chat";

    // Used only when a product-specific image cannot be loaded.
    const FALLBACK_IMAGE_URL =
      "https://zmqjrkgzbscuyvrepskk.supabase.co/storage/v1/object/public/product-images/ALL%20PRODUCTS.png";

    const chatBody = document.getElementById("chatBody");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const quickActions = document.getElementById("quickActions");

    let sessionId = localStorage.getItem("zapsuleSessionId");

    if (!sessionId) {
      sessionId =
        window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : "session-" + Date.now() + "-" + Math.random().toString(36).slice(2);

      localStorage.setItem("zapsuleSessionId", sessionId);
    }

    function sanitizeImageUrl(value) {
      if (typeof value !== "string") return "";

      let url = value
        .trim()
        .replace(/^['"`]+/, "")
        .replace(/['"`*),.;\]}]+$/g, "")
        .replace(/&amp;/gi, "&");

      try {
        const parsed = new URL(url);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
        return parsed.href;
      } catch {
        return "";
      }
    }

    function extractImageUrlsFromText(text) {
      if (typeof text !== "string") return [];

      const urls = [];
      const pattern = /IMAGE_URL\s*:\s*(https?:\/\/[^\s<>"']+)/gi;
      let match;

      while ((match = pattern.exec(text)) !== null) {
        const clean = sanitizeImageUrl(match[1]);
        if (clean && !urls.includes(clean)) urls.push(clean);
      }

      return urls;
    }

    function removeImageUrlLines(text) {
      if (typeof text !== "string") return "";

      return text
        .replace(/IMAGE_URL\s*:\s*https?:\/\/[^\s<>"']+/gi, "")
        .replace(/^[ \t]+$/gm, "")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function findImageUrlsDeep(value, depth = 0, found = []) {
      if (depth > 7 || value == null) return found;

      if (typeof value === "string") {
        for (const url of extractImageUrlsFromText(value)) {
          if (!found.includes(url)) found.push(url);
        }
        return found;
      }

      if (Array.isArray(value)) {
        for (const item of value) findImageUrlsDeep(item, depth + 1, found);
        return found;
      }

      if (typeof value === "object") {
        // Prefer fields that are explicitly intended to contain product images.
        const imageKeys = ["image_url", "imageUrl", "imageURL", "image_line", "imageLine"];

        for (const key of imageKeys) {
          if (!(key in value)) continue;

          const raw = value[key];

          if (typeof raw === "string") {
            const lineUrls = extractImageUrlsFromText(raw);
            if (lineUrls.length) {
              for (const url of lineUrls) {
                if (!found.includes(url)) found.push(url);
              }
            } else {
              const clean = sanitizeImageUrl(raw.replace(/^IMAGE_URL\s*:\s*/i, ""));
              if (clean && !found.includes(clean)) found.push(clean);
            }
          }
        }

        for (const child of Object.values(value)) {
          findImageUrlsDeep(child, depth + 1, found);
        }
      }

      return found;
    }

    function extractReplyText(data) {
      const candidates = [];

      if (typeof data === "string") candidates.push(data);

      if (data && typeof data === "object") {
        for (const key of ["output", "reply", "message", "text", "answer", "content"]) {
          if (typeof data[key] === "string") candidates.push(data[key]);
        }

        if (data.data && typeof data.data === "object") {
          for (const key of ["output", "reply", "message", "text", "answer", "content"]) {
            if (typeof data.data[key] === "string") candidates.push(data.data[key]);
          }
        }
      }

      if (Array.isArray(data) && data.length > 0) {
        const first = data[0];
        if (typeof first === "string") candidates.push(first);
        if (first && typeof first === "object") {
          for (const key of ["output", "reply", "message", "text", "answer", "content"]) {
            if (typeof first[key] === "string") candidates.push(first[key]);
          }
        }
      }

      return candidates.find((value) => value.trim()) || "";
    }

    function normalizeBotResponse(data) {
      const rawText = extractReplyText(data);
      const textImageUrls = extractImageUrlsFromText(rawText);
      const structuredImageUrls = findImageUrlsDeep(data);
      const imageUrls = [...new Set([...textImageUrls, ...structuredImageUrls])];
      const cleanText = removeImageUrlLines(rawText);

      return {
        text: cleanText,
        imageUrls
      };
    }

    function createImageElement(imageUrl) {
      const img = document.createElement("img");
      const errorText = document.createElement("div");

      img.src = imageUrl;
      img.alt = "Product image";
      img.className = "product-image";
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";

      errorText.className = "image-error";
      errorText.textContent = "Image could not be loaded.";

      img.addEventListener("error", () => {
        console.error("Product image failed to load:", img.src);

        // Do not silently delete the image. Try the store fallback once.
        if (img.dataset.fallbackAttempted !== "1" && img.src !== FALLBACK_IMAGE_URL) {
          img.dataset.fallbackAttempted = "1";
          img.src = FALLBACK_IMAGE_URL;
          return;
        }

        img.style.display = "none";
        errorText.style.display = "block";
      });

      const wrapper = document.createElement("div");
      wrapper.className = "image-wrap";
      wrapper.appendChild(img);
      wrapper.appendChild(errorText);

      return wrapper;
    }

    function addMessage(text, sender = "bot", extraClass = "", imageUrls = []) {
      const row = document.createElement("div");
      row.className = `message-row ${sender} ${extraClass}`.trim();

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const safeText = typeof text === "string" ? text.trim() : "";
      const validImageUrls = imageUrls
        .map(sanitizeImageUrl)
        .filter((url, index, list) => url && list.indexOf(url) === index);

      if (safeText) {
        const textNode = document.createElement("div");
        textNode.className = "message-text";
        textNode.textContent = safeText;
        bubble.appendChild(textNode);
      }

      for (const imageUrl of validImageUrls) {
        bubble.appendChild(createImageElement(imageUrl));
      }

      // Never append an empty white bubble.
      if (!safeText && validImageUrls.length === 0) {
        const fallbackText = document.createElement("div");
        fallbackText.className = "message-text";
        fallbackText.textContent =
          sender === "bot"
            ? "I received a response, but there was no message or image to display."
            : "";
        bubble.appendChild(fallbackText);
      }

      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollToBottom();

      return row;
    }

    function addBotResponse(data) {
      const parsed = normalizeBotResponse(data);
      return addMessage(parsed.text, "bot", "", parsed.imageUrls);
    }

    function addTypingIndicator() {
      const row = document.createElement("div");
      row.className = "message-row bot";
      row.id = "typingRow";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      bubble.appendChild(typing);
      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      document.getElementById("typingRow")?.remove();
    }

    function scrollToBottom() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function resizeTextarea() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + "px";
    }

    async function readResponse(response) {
      const contentType = response.headers.get("content-type") || "";

      if (contentType.includes("application/json")) {
        return response.json();
      }

      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch {
        return { output: text };
      }
    }

    async function sendMessage(prefilledMessage = null) {
      const message = (prefilledMessage ?? messageInput.value).trim();

      if (!message || sendButton.disabled) return;

      if (quickActions) quickActions.style.display = "none";

      addMessage(message, "user");

      messageInput.value = "";
      resizeTextarea();

      sendButton.disabled = true;
      messageInput.disabled = true;
      addTypingIndicator();

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            sessionId,
            source: "zapsule-web"
          })
        });

        const data = await readResponse(response);

        if (!response.ok) {
          const backendMessage = extractReplyText(data);
          throw new Error(backendMessage || `HTTP ${response.status}`);
        }

        removeTypingIndicator();
        addBotResponse(data);
      } catch (error) {
        console.error("Zapsule webhook error:", error);
        removeTypingIndicator();

        addMessage(
          "I couldn't connect to Zapsule AI. Please try again.",
          "bot",
          "error"
        );
      } finally {
        sendButton.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", () => sendMessage());
    messageInput.addEventListener("input", resizeTextarea);

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.querySelectorAll(".quick-btn").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.dataset.message));
    });
  </script>
</body>
</html>
