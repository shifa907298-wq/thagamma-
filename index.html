<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ecommerce Chatbot</title>

  <link
    href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css"
    rel="stylesheet"
  >
</head>

<body>

  <div id="n8n-chat"></div>

  <script type="module">
    import { createChat } from
      "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";

    createChat({
      webhookUrl: "https://zapsule.app.n8n.cloud/webhook-test/ecommerce-chat",
      mode: "window",
      defaultLanguage: "en",

      initialMessages: [
        "Hi there! 👋",
        "How can I help you with our products?"
      ],

      i18n: {
        en: {
          title: "Ecommerce Assistant",
          subtitle: "Ask me about products, prices, and stock.",
          inputPlaceholder: "Type your question..."
        }
      }
    });
  </script>

</body>
</html>
