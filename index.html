<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1d35" />
  <title>Zap Chat</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    :root {
      --bg: #d9b463;
      --brand: #0f1d35;
      --surface: #ffffff;
      --bot: #f8fafc;
      --text: #111827;
      --muted: #667085;
      --border: rgba(255,255,255,.7);
      --line: #e5e7eb;
      --danger: #b42318;
      --success: #15803d;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .chat-shell {
      width: min(100%, 860px);
      height: min(92vh, 820px);
      min-height: 560px;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(15,29,53,.12);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--bg);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
    }

    .header-title {
      font-weight: 800;
      font-size: 14px;
    }

    .status {
      margin-top: 2px;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    .chat-body {
      overflow-y: auto;
      padding: 14px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      margin-bottom: 10px;
    }

    .message-row.user { justify-content: flex-end; }

    .bubble {
      max-width: min(80%, 620px);
      padding: 10px 12px;
      border-radius: 13px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      background: var(--bot);
      border-bottom-left-radius: 4px;
    }

    .user .bubble {
      background: var(--brand);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .error .bubble {
      color: var(--danger);
      background: #fef3f2;
    }

    .quick-actions,
    .category-actions,
    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 4px 0 12px;
    }

    button {
      font: inherit;
    }

    .chip,
    .compare-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .chip:hover,
    .compare-btn:hover {
      background: #f8fafc;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      margin: 6px 0 10px;
    }

    .product-card {
      min-width: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .product-media {
      aspect-ratio: 1 / 1;
      width: 100%;
      background: #fff;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
    }

    .image-placeholder {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .product-copy {
      padding: 10px;
    }

    .product-name {
      font-size: 13px;
      line-height: 1.35;
      font-weight: 800;
      cursor: pointer;
    }

    .product-name:hover { text-decoration: underline; }

    .brand,
    .category,
    .description {
      color: #475467;
      font-size: 11px;
      line-height: 1.4;
    }

    .brand { margin-top: 3px; }

    .price {
      margin-top: 6px;
      font-weight: 800;
      font-size: 13px;
    }

    .stock {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .in-stock {
      background: #dcfce7;
      color: #166534;
    }

    .out-stock {
      background: #fee2e2;
      color: #991b1b;
    }

    .description {
      margin-top: 7px;
    }

    .specs {
      margin-top: 8px;
      display: grid;
      gap: 4px;
    }

    .spec {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 3px;
    }

    .spec span:first-child { color: var(--muted); }
    .spec span:last-child { font-weight: 700; text-align: right; }

    .comparison-wrap {
      overflow-x: auto;
      margin: 6px 0 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .comparison-table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      font-size: 11px;
    }

    .comparison-table th,
    .comparison-table td {
      padding: 9px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    .comparison-table th {
      background: #f8fafc;
      font-weight: 800;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #98a2b3;
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .14s; }
    .typing span:nth-child(3) { animation-delay: .28s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .45; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 8px;
    }

    .composer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      align-items: end;
      border: 1px solid rgba(255,255,255,.9);
      background: rgba(255,255,255,.45);
      border-radius: 13px;
      padding: 6px;
    }

    textarea {
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      min-height: 38px;
      max-height: 120px;
      padding: 8px;
      font: inherit;
      font-size: 13px;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }

    .send-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .helper {
      margin-top: 4px;
      text-align: center;
      color: var(--muted);
      font-size: 8px;
    }

    @media (max-width: 700px) {
      body { padding: 0; }
      .chat-shell {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
      }
      .product-grid {
        grid-template-columns: 1fr;
      }
      .product-media {
        aspect-ratio: 4 / 3;
      }
      .bubble { max-width: 90%; }
    }
  </style>
</head>

<body>
  <main class="chat-shell">
    <header class="chat-header">
      <div class="logo">Z</div>
      <div>
        <div class="header-title">ZAP CHAT</div>
        <div class="status">
          <span class="status-dot"></span>
          AI product assistant
        </div>
      </div>
    </header>

    <section id="chatBody" class="chat-body" aria-live="polite">
      <div class="message-row bot">
        <div class="bubble">
          Hi! I can help you discover products, compare options, check prices and availability, or browse by category.
        </div>
      </div>

      <div class="quick-actions" id="quickActions">
        <button class="chip" data-message="What products are available?">Browse categories</button>
        <button class="chip" data-message="Show me smartphones under 100 OMR">Phones under 100 OMR</button>
        <button class="chip" data-message="Recommend a good power bank">Recommend a power bank</button>
      </div>
    </section>

    <footer class="composer">
      <div class="composer-row">
        <textarea id="messageInput" maxlength="1200" rows="1" placeholder="Ask Zap Chat..."></textarea>
        <button id="sendButton" class="send-btn" type="button" aria-label="Send">➤</button>
      </div>
      <div class="helper">Powered by Zap Chat AI</div>
    </footer>
  </main>

  <script>
    /* =====================================================
       N8N v6.2 PRODUCTION WEBHOOK
       ===================================================== */
    const CHAT_API_URL =
      "https://zapsoole.app.n8n.cloud/webhook/zap-chat-search-v6";

    const chatBody = document.getElementById("chatBody");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const quickActions = document.getElementById("quickActions");

    const asText = (value) =>
      typeof value === "string" ? value.trim() : "";

    function createSafeId(prefix) {
      if (window.crypto && typeof crypto.randomUUID === "function") {
        return prefix + crypto.randomUUID();
      }
      return (
        prefix +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 14)
      );
    }

    let sessionId = localStorage.getItem("zapChatSessionId");
    if (!sessionId || !/^[A-Za-z0-9_-]{16,128}$/.test(sessionId)) {
      sessionId = createSafeId("session_");
      localStorage.setItem("zapChatSessionId", sessionId);
    }

    let browserUserId = localStorage.getItem("zapChatBrowserUserId");
    if (!browserUserId || !/^[A-Za-z0-9_-]{16,128}$/.test(browserUserId)) {
      browserUserId = createSafeId("browser_");
      localStorage.setItem("zapChatBrowserUserId", browserUserId);
    }

    let activeCategory = localStorage.getItem("zapChatActiveCategory") || "";
    let lastProducts = [];

    try {
      const saved = JSON.parse(localStorage.getItem("zapChatLastProducts") || "[]");
      if (Array.isArray(saved)) {
        lastProducts = saved.slice(0, 3);
      }
    } catch {}

    function scrollBottom() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }

    function addMessage(message, sender = "bot", extraClass = "") {
      if (!message) return;

      const row = document.createElement("div");
      row.className = `message-row ${sender} ${extraClass}`.trim();

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message;

      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollBottom();
    }

    function addTyping() {
      removeTyping();

      const row = document.createElement("div");
      row.id = "typingRow";
      row.className = "message-row bot";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML =
        '<div class="typing"><span></span><span></span><span></span></div>';

      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollBottom();
    }

    function removeTyping() {
      document.getElementById("typingRow")?.remove();
    }

    function safeImageUrl(value) {
      if (value == null) return "";

      let raw = String(value).trim();
      if (!raw) return "";

      if (raw.startsWith("//")) raw = "https:" + raw;

      try {
        const url = new URL(raw);
        if (url.protocol !== "https:") return "";
        return url.href;
      } catch {
        return "";
      }
    }

    function getTitle(product) {
      return asText(product?.title) || asText(product?.name) || "Product";
    }

    function getPrice(product) {
      const formatted = asText(product?.price?.formatted);
      if (formatted) return formatted;

      const amount = Number(product?.price?.amount ?? product?.price);
      return Number.isFinite(amount)
        ? `OMR ${amount.toFixed(3)}`
        : "Price not confirmed";
    }

    function getStock(product) {
      const status = product?.stock?.status ?? product?.availability;
      const label = asText(product?.stock?.label);

      if (label) return { status, label };

      if (status === "in_stock") {
        return { status, label: "In Stock" };
      }

      if (status === "out_of_stock") {
        return { status, label: "Out of Stock" };
      }

      return { status: "unknown", label: "Stock not confirmed" };
    }

    function renderProductImage(container, product) {
      const imageUrl = safeImageUrl(
        product?.image?.url ??
        product?.image_url ??
        product?.imageUrl ??
        ""
      );

      if (!imageUrl) {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "No product image available";
        container.appendChild(placeholder);
        return;
      }

      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = getTitle(product);
      img.loading = "lazy";
      img.decoding = "async";

      img.addEventListener("error", () => {
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "Image could not be loaded";
        container.replaceChildren(placeholder);
      });

      container.appendChild(img);
    }

    function rememberProducts(products) {
      if (!Array.isArray(products) || !products.length) return;

      lastProducts = products
        .slice(0, 3)
        .map((product) => ({
          id: String(product?.id ?? "").slice(0, 128),
          name: getTitle(product).slice(0, 180),
          category: asText(product?.category).slice(0, 120)
        }))
        .filter((product) => product.id || product.name);

      localStorage.setItem(
        "zapChatLastProducts",
        JSON.stringify(lastProducts)
      );
    }

    function addProducts(products, remember = true) {
      if (!Array.isArray(products) || !products.length) return;

      if (remember) rememberProducts(products);

      const grid = document.createElement("div");
      grid.className = "product-grid";

      products.slice(0, 3).forEach((product) => {
        const card = document.createElement("article");
        card.className = "product-card";

        const media = document.createElement("div");
        media.className = "product-media";
        renderProductImage(media, product);

        const copy = document.createElement("div");
        copy.className = "product-copy";

        const name = document.createElement("div");
        name.className = "product-name";
        name.textContent = getTitle(product);
        name.title = "View product details";
        name.tabIndex = 0;
        name.setAttribute("role", "button");

        const openDetails = () => {
          sendMessage(
            getTitle(product),
            {
              action: "get_product_details",
              productId: String(product?.id ?? "")
            }
          );
        };

        name.addEventListener("click", openDetails);
        name.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openDetails();
          }
        });

        const brand = document.createElement("div");
        brand.className = "brand";
        brand.textContent = asText(product?.brand);

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = getPrice(product);

        const stockInfo = getStock(product);
        const stock = document.createElement("span");
        stock.className =
          "stock " +
          (stockInfo.status === "in_stock" ? "in-stock" : "out-stock");
        stock.textContent = stockInfo.label;

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = asText(product?.category);

        const description = document.createElement("div");
        description.className = "description";
        description.textContent = asText(product?.description);

        const specs = document.createElement("div");
        specs.className = "specs";

        const keySpecs = Array.isArray(product?.keySpecs)
          ? product.keySpecs.slice(0, 4)
          : [];

        keySpecs.forEach((item) => {
          const row = document.createElement("div");
          row.className = "spec";

          const label = document.createElement("span");
          label.textContent = asText(item?.label);

          const value = document.createElement("span");
          value.textContent = String(item?.value ?? "");

          row.append(label, value);
          specs.appendChild(row);
        });

        copy.appendChild(name);

        if (brand.textContent) copy.appendChild(brand);

        copy.appendChild(price);
        copy.appendChild(stock);

        if (category.textContent) copy.appendChild(category);
        if (description.textContent) copy.appendChild(description);
        if (keySpecs.length) copy.appendChild(specs);

        card.append(media, copy);
        grid.appendChild(card);
      });

      chatBody.appendChild(grid);

      if (remember && lastProducts.length >= 2) {
        const actions = document.createElement("div");
        actions.className = "product-actions";

        const compare = document.createElement("button");
        compare.type = "button";
        compare.className = "compare-btn";
        compare.textContent = "Compare these products";

        compare.addEventListener("click", () => {
          sendMessage(
            "Compare these products",
            {
              action: "compare_products",
              compareProductIds: lastProducts
                .map((product) => product.id)
                .filter(Boolean)
            }
          );
        });

        actions.appendChild(compare);
        chatBody.appendChild(actions);
      }

      scrollBottom();
    }

    function addCategories(categories) {
      if (!Array.isArray(categories) || !categories.length) return;

      const wrapper = document.createElement("div");
      wrapper.className = "category-actions";

      [...new Set(categories.map(asText).filter(Boolean))].forEach(
        (category) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "chip";
          button.textContent = category;

          button.addEventListener("click", () => {
            activeCategory = category;

            localStorage.setItem(
              "zapChatActiveCategory",
              activeCategory
            );

            sendMessage(
              `Show me ${category}`,
              {
                action: "browse_category",
                category
              }
            );
          });

          wrapper.appendChild(button);
        }
      );

      chatBody.appendChild(wrapper);
      scrollBottom();
    }

    function addComparison(comparison) {
      if (
        !comparison ||
        !Array.isArray(comparison.rows) ||
        !comparison.rows.length
      ) {
        return;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "comparison-wrap";

      const table = document.createElement("table");
      table.className = "comparison-table";

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      [
        "Product",
        "Capacity",
        "Wattage",
        "Price",
        "Rating",
        "Stock",
        "Key Features"
      ].forEach((heading) => {
        const th = document.createElement("th");
        th.textContent = heading;
        headRow.appendChild(th);
      });

      thead.appendChild(headRow);

      const tbody = document.createElement("tbody");

      comparison.rows.forEach((row) => {
        const tr = document.createElement("tr");

        const features = Array.isArray(row?.keyFeatures)
          ? row.keyFeatures.join(", ")
          : "";

        [
          row?.title || "Product",
          row?.capacity || "—",
          row?.wattage || "—",
          row?.price || "—",
          row?.rating ?? "—",
          row?.stock || "—",
          features || "—"
        ].forEach((value) => {
          const td = document.createElement("td");
          td.textContent = String(value);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      table.append(thead, tbody);
      wrapper.appendChild(table);
      chatBody.appendChild(wrapper);
      scrollBottom();
    }

    async function readBackendResponse(response) {
      /* Read text FIRST.
         This avoids Response.json() throwing on an empty body. */
      const raw = await response.text();

      if (!raw.trim()) {
        throw new Error(
          `n8n returned an empty response body (HTTP ${response.status})`
        );
      }

      try {
        return JSON.parse(raw);
      } catch {
        throw new Error(
          `n8n returned invalid JSON (HTTP ${response.status}): ${raw.slice(0, 180)}`
        );
      }
    }

    function renderResponse(data) {
      console.log("Zap Chat backend response:", data);

      const output = asText(data?.output);
      if (output) addMessage(output, "bot");

      addCategories(data?.categories);

      const remember =
        data?.responseType !== "product_detail" &&
        data?.responseType !== "comparison";

      addProducts(data?.products, remember);
      addComparison(data?.comparison);
    }

    async function sendMessage(prefilled = null, meta = {}) {
      const message = asText(prefilled ?? input.value);

      if (!message || sendButton.disabled) return;

      if (quickActions) {
        quickActions.style.display = "none";
      }

      addMessage(message, "user");

      input.value = "";
      resizeInput();

      sendButton.disabled = true;
      addTyping();

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);

      const payload = {
        message,
        sessionId,
        browserUserId,
        activeCategory,
        contextProducts: lastProducts,
        source: "zap-chat-web",
        ...meta
      };

      console.log("Sending to n8n:", payload);

      try {
        const response = await fetch(CHAT_API_URL, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        const data = await readBackendResponse(response);

        if (!response.ok) {
          throw new Error(
            asText(data?.output) || `n8n HTTP ${response.status}`
          );
        }

        removeTyping();
        renderResponse(data);

      } catch (error) {
        removeTyping();

        console.error("Zap Chat request failed:", error);

        const message =
          error?.name === "AbortError"
            ? "Zap Chat took too long to respond. Please try again."
            : `Zap Chat error: ${error?.message || "Unable to connect."}`;

        addMessage(message, "bot", "error");

      } finally {
        clearTimeout(timeout);
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener("click", () => sendMessage());

    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.querySelectorAll(".quick-actions .chip").forEach((button) => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.message);
      });
    });
  </script>
</body>
</html>
